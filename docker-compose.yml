services:
  db:
    image: postgres:15
    container_name: postgres_pfinal
    restart: always
    environment:
      POSTGRES_USER: simon
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: ProyectoFinalDB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8.1
    container_name: pgadmin_pfinal
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
